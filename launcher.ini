; Memory Supervisor - launcher configuration
;
; Written automatically when the panel starts under a known interpreter.
; run.bat and run_silent.vbs read this to find Python again without relying on
; PATH, which keeps the launchers working after a Python update or reinstall.
;
; Set "python" to the full path of a python.exe or pythonw.exe to pin it
; explicitly, e.g.  python=C:\Python312\pythonw.exe
;
python=C:\Users\21888\.dsh\dsh-runtimes\dsh-primary-runtime\dependencies\python\pythonw.exe
